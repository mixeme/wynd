name: Desktop checks

on:
  push:
    branches: [main]
    paths:
      - 'cmd/wynd-workshop/**'
      - 'cmd/wynd-signer/**'
      - 'cmd/wynd-desktop/**'
      - 'internal/desktop/**'
      - 'internal/**'
      - 'web/**'
      - 'scripts/test*.bat'
      - 'scripts/build-desktop.bat'
      - 'scripts/build-workshop.bat'
      - 'scripts/build-signer.bat'
      - 'scripts/test-desktop-linux.sh'
      - 'scripts/build-desktop-linux.sh'
      - 'scripts/package-desktop-linux.sh'
      - 'go.mod'
      - 'go.sum'
      - 'VERSION'
      - '.github/workflows/desktop.yaml'
      - '.github/workflows/desktop-client.yaml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            cmd/wynd-workshop/frontend/package-lock.json
            cmd/wynd-signer/frontend/package-lock.json
            cmd/wynd-desktop/frontend/package-lock.json
      - name: Install frontend dependencies
        shell: cmd
        run: |
          call npm --prefix web ci
          if errorlevel 1 exit /b 1
          call npm --prefix cmd/wynd-workshop/frontend ci
          if errorlevel 1 exit /b 1
          call npm --prefix cmd/wynd-signer/frontend ci
          if errorlevel 1 exit /b 1
          call npm --prefix cmd/wynd-desktop/frontend ci
          if errorlevel 1 exit /b 1
      - name: Desktop gate
        shell: cmd
        run: scripts\test-desktop.bat

  desktop-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            cmd/wynd-desktop/frontend/package-lock.json
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libx11-dev xvfb x11-apps imagemagick
      - name: Install frontend dependencies
        run: |
          npm --prefix web ci
          npm --prefix cmd/wynd-desktop/frontend ci
      - name: Linux desktop gate
        run: scripts/test-desktop-linux.sh
      - name: Linux window screenshot
        run: |
          xvfb-run -a -s "-screen 0 1024x900x24" bash -c '
            ./dist/wynd-desktop --smoke-test &
            pid=$!
            sleep 3
            import -window root /tmp/wynd-linux.png
            wait $pid
          '
      - uses: actions/upload-artifact@v7
        with:
          name: wynd-linux-screenshot
          path: /tmp/wynd-linux.png
          if-no-files-found: error
          retention-days: 7
      - name: Linux packages
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          mkdir -p "$RUNNER_TEMP/bin"
          curl -L --fail --silent --show-error -o "$RUNNER_TEMP/bin/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/bin/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/appimagetool"
          APPIMAGETOOL="$RUNNER_TEMP/bin/appimagetool" scripts/package-desktop-linux.sh
          dpkg-deb --info dist/wynd-desktop_*_amd64.deb
          sudo apt-get install -y ./dist/wynd-desktop_*_amd64.deb
          xvfb-run -a timeout 20s wynd-desktop --smoke-test
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a timeout 30s ./dist/Wynd-*_x86_64.AppImage --smoke-test
      - uses: actions/upload-artifact@v7
        with:
          name: wynd-linux-packages
          path: |
            dist/wynd-desktop_*_amd64.deb
            dist/Wynd-*_x86_64.AppImage
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
