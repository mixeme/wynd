name: Desktop checks

on:
  push:
    branches: [main]
    paths:
      - 'cmd/wynd-installer/**'
      - 'cmd/wynd-signer/**'
      - 'cmd/wynd-desktop/**'
      - 'internal/desktop/**'
      - 'internal/**'
      - 'web/**'
      - 'scripts/test*.bat'
      - 'go.mod'
      - 'go.sum'
      - 'VERSION'
      - '.github/workflows/desktop.yaml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            cmd/wynd-installer/frontend/package-lock.json
            cmd/wynd-signer/frontend/package-lock.json
            cmd/wynd-desktop/frontend/package-lock.json
      - name: Install frontend dependencies
        shell: cmd
        run: |
          call npm --prefix web ci
          if errorlevel 1 exit /b 1
          call npm --prefix cmd/wynd-installer/frontend ci
          if errorlevel 1 exit /b 1
          call npm --prefix cmd/wynd-signer/frontend ci
          if errorlevel 1 exit /b 1
          call npm --prefix cmd/wynd-desktop/frontend ci
          if errorlevel 1 exit /b 1
      - name: Desktop gate
        shell: cmd
        run: scripts\test-desktop.bat
