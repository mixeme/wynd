name: Image

# Образ Wynd в реестре GitHub (ghcr.io) — откуда его берёт настольный
# установщик (план 45) и тот, кто ставит руками: docker pull ghcr.io/<владелец>/wynd:<версия>.
#
# Репозиторий на GitHub — зеркало Gitea: проверки (тесты, сборка) идут там,
# в .gitea/workflows/ci.yaml, а здесь только публикация. Gitea этот файл не
# исполняет: у неё есть свой каталог .gitea/workflows.
#
# Образ собирается, когда меняется VERSION, то есть на каждый выпуск, и под
# две архитектуры: установщик ставит Wynd на x86-64 и на ARM64.
#
# После первой публикации пакет на GitHub закрыт: его надо один раз открыть
# (Packages → wynd → Package settings → Change visibility → Public), иначе
# сервер не скачает образ без входа.
#
# У каждой сборки своя метка: <версия>-amd64 и <версия>-arm64. Метки <версия>
# и latest — оглавление, которое ссылается на эти две. Версий без меток
# (untagged) на странице пакета при этом не остаётся: раньше сборки под
# архитектуры лежали именно там, выглядели мусором, и их удаление ломало
# docker pull при живой метке (2026-10-09). Подтверждения происхождения
# (provenance) выключены по той же причине: они тоже ложатся без меток.
#
# Удалять со страницы пакета можно только выпуск целиком — все три метки.

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # VERSION в рабочей копии бывает с CRLF: голый cat дал бы негодный тег.
      # Имя образа — строчными: ghcr.io заглавных букв во владельце не принимает.
      - name: version and image name
        id: meta
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/wynd"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      # QEMU нужен только последней стадии образа под ARM64 (apk add); клиент
      # и бинарь собираются на машине сборки и под чужую архитектуру — без него.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Клиент и бинарь собираются один раз на машине сборки: вторая сборка
      # берёт их из кэша сборщика и доделывает только свою последнюю стадию.
      - name: amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-amd64
          provenance: false
          push: true
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-arm64
          provenance: false
          push: true
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      # Оглавление: docker pull <версия> сам выберет сборку под свой процессор.
      - name: version and latest
        run: |
          image="${{ steps.meta.outputs.image }}"
          version="${{ steps.meta.outputs.version }}"
          docker buildx imagetools create \
            -t "${image}:${version}" -t "${image}:latest" \
            "${image}:${version}-amd64" "${image}:${version}-arm64"
          docker buildx imagetools inspect "${image}:${version}"
