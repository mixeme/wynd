name: Desktop client

# Wynd Настольный (планы 55, 61 и 63) — сборка выпуска из тега desktop-vX.Y.Z
# на чистой машине GitHub и удостоверение сборки (attestation): любой
# проверит, из какого коммита собран exe, командой
#   gh attestation verify wynd-desktop.exe --repo mixeme/wynd
#
# Выпуск создаётся ЧЕРНОВИКОМ и без подписи: подпись и публикацию делает
# «Wynd Подпись» (план 63), как у Мастерской. Открытый ключ экосистемы
# (signing-key.pub) build-desktop.bat вшивает в сборку — по нему окно
# проверяет самообновление.

on:
  push:
    tags: ['desktop-v*']
  # Руками — только сборка (проверка сценария): без удостоверения и черновика,
  # они бывают только от тега выпуска.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Desktop gate
        shell: cmd
        run: |
          call npm --prefix web ci
          if errorlevel 1 exit /b 1
          call npm --prefix cmd/wynd-installer/frontend ci
          if errorlevel 1 exit /b 1
          call npm --prefix cmd/wynd-signer/frontend ci
          if errorlevel 1 exit /b 1
          call npm --prefix cmd/wynd-desktop/frontend ci
          if errorlevel 1 exit /b 1
          call scripts\test-desktop.bat
          if errorlevel 1 exit /b 1

      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: build
        shell: cmd
        run: scripts\build-desktop.bat

      - uses: actions/attest-build-provenance@v4
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        with:
          subject-path: dist/wynd-desktop.exe

      # Черновик выпуска с exe и его суммой.
      - name: draft release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Черновик на этот тег мог остаться от прежнего запуска: у GitHub
          # черновики не привязаны к тегу, и повтор оставил бы два «одной версии».
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            -q '.[] | select(.draft and .tag_name == "'"$GITHUB_REF_NAME"'") | .id' \
            | while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          sha256sum dist/wynd-desktop.exe | cut -d' ' -f1 > dist/wynd-desktop.exe.sha256
          gh release create "$GITHUB_REF_NAME" dist/wynd-desktop.exe dist/wynd-desktop.exe.sha256 \
            --draft --title "Wynd Настольный ${GITHUB_REF_NAME#desktop-v}" --notes "- (что нового — дописать до публикации)"
