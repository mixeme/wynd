name: Android

# Проверки main/PR и ручной запуск сохраняют unsigned APK в Actions artifacts.
# Только android-тег создаёт черновик; постоянный ключ остаётся у владельца.
on:
  push:
    branches: [main]
    tags: ['android-v*']
    paths:
      - 'android/**'
      - 'assets/icon-small.svg'
      - 'web/static/icon-192.png'
      - 'web/src/**'
      - 'web/static/fonts/**'
      - 'web/static/icons.svg'
      - 'web/package*.json'
      - 'web/vite.android-startup.config.ts'
      - 'web/vite.config.ts'
      - 'web/svelte.config.js'
      - 'scripts/build-android.ps1'
      - '.github/workflows/android.yaml'
  pull_request:
    paths:
      - 'android/**'
      - 'assets/icon-small.svg'
      - 'web/static/icon-192.png'
      - 'web/src/**'
      - 'web/static/fonts/**'
      - 'web/static/icons.svg'
      - 'web/package*.json'
      - 'web/vite.android-startup.config.ts'
      - 'web/vite.config.ts'
      - 'web/svelte.config.js'
      - 'scripts/build-android.ps1'
      - '.github/workflows/android.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/android-v') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Android environment directories
        shell: bash
        run: |
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/android-env/gradle-user-home" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-env/user" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: '17'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Startup UI dependencies
        working-directory: web
        run: npm ci
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '13114758'
          packages: 'platforms;android-36 build-tools;35.0.0'
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/android-v')
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^versionName=//p' android/version.properties | tr -d '\r')
          test "$GITHUB_REF_NAME" = "android-v$version"
      - name: Debug keystore for embedded build
        # assembleStandardDebug проверяет упаковку web/dist в assets; отладочная
        # подпись ищет ключ в wyndEnvironmentRoot, на чистой машине его нет.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-env/keys"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/android-env/keys/wynd-debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Tests, lint and unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          android/gradlew --no-daemon --console=plain -p android \
            --project-cache-dir "$RUNNER_TEMP/android-env/project-cache" \
            -PwyndEnvironmentRoot="$RUNNER_TEMP/android-env" \
            testStandardDebugUnitTest testFdroidDebugUnitTest \
            lintStandardDebug lintFdroidDebug lintStandardRelease lintFdroidRelease \
            assembleStandardRelease assembleFdroidRelease
          mkdir -p dist
          cp android/app/build/outputs/apk/standard/release/app-standard-release-unsigned.apk dist/wynd-android-unsigned.apk
          cp android/app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk dist/wynd-android-fdroid-unsigned.apk
          sha256sum dist/wynd-android-unsigned.apk | cut -d' ' -f1 > dist/wynd-android-unsigned.apk.sha256
          sha256sum dist/wynd-android-fdroid-unsigned.apk | cut -d' ' -f1 > dist/wynd-android-fdroid-unsigned.apk.sha256
      - name: Embedded interface build
        # Подготовка плана 50: обычные APK выше без клиента, эта сборка
        # проверяет упаковку web/dist в assets и режим BuildConfig.EMBEDDED_UI.
        shell: bash
        run: |
          set -euo pipefail
          android/gradlew --no-daemon --console=plain -p android \
            --project-cache-dir "$RUNNER_TEMP/android-env/project-cache" \
            -PwyndEnvironmentRoot="$RUNNER_TEMP/android-env" \
            -PwyndEmbeddedUi=true assembleStandardDebug
      - name: Unsigned APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: wynd-android-unsigned
          path: |
            dist/wynd-android-unsigned.apk
            dist/wynd-android-unsigned.apk.sha256
            dist/wynd-android-fdroid-unsigned.apk
            dist/wynd-android-fdroid-unsigned.apk.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wynd-android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  draft:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wynd-android-unsigned
          path: dist
      - name: Verify downloaded APK checksum
        shell: bash
        run: |
          set -euo pipefail
          expected=$(tr -d '\r\n' < dist/wynd-android-unsigned.apk.sha256)
          actual=$(sha256sum dist/wynd-android-unsigned.apk | cut -d' ' -f1)
          test "$expected" = "$actual"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/wynd-android-unsigned.apk
      - name: Draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace owner-signed assets.' >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            dist/wynd-android-unsigned.apk dist/wynd-android-unsigned.apk.sha256 \
            --draft --verify-tag --title "Wynd Android ${GITHUB_REF_NAME#android-v}" \
            --notes 'Unsigned build. Local APK signing and owner publication are required.'
