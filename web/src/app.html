<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<!-- resizes-content: клавиатура сжимает страницу, а не наезжает на
		     неё — иначе браузер сдвигал всё окно вверх (session/viewport.ts). -->
		<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
		<title>Wynd</title>
		<!-- Манифест — в исходном HTML, не из JS: Firefox на Android решает,
		     устанавливается ли сайт как приложение, по странице до гидрации, и
		     без ссылки делал ярлык, открывающийся во вкладке браузера. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<script>
			// Loopback dev via scripts\run.bat: drop stale service workers so rebuilds show up.
			if (location.hostname === '127.0.0.1' || location.hostname === 'localhost') {
				navigator.serviceWorker?.getRegistrations().then(function (regs) {
					regs.forEach(function (r) {
						r.unregister();
					});
				});
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
