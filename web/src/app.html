<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<!-- resizes-content: клавиатура сжимает страницу, а не наезжает на
		     неё — иначе браузер сдвигал всё окно вверх (session/viewport.ts). -->
		<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
		<title>Wynd</title>
		<!-- Манифест — в исходном HTML, не из JS: Firefox на Android решает,
		     устанавливается ли сайт как приложение, по странице до гидрации, и
		     без ссылки делал ярлык, открывающийся во вкладке браузера. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<!-- Цвет строки состояния — тоже в исходном HTML: Vivaldi на Android
		     берёт его при запуске и метку, вставленную скриптом, не видел —
		     строка оставалась белой. Тёмную тему ставит корневой макет в эту же метку. -->
		<meta name="theme-color" content="#F4F0E9" />
		<script>
			// iPhone увеличивает страницу, когда фокус попадает в поле мельче 16 px
			// (строка ввода, кнопка фото рядом с ней). maximum-scale=1 iOS понимает
			// как «без автоувеличения», а щипок пальцами оставляет. Только iOS: на
			// Android та же метка запретила бы щипок.
			if (/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
				var vp = document.querySelector('meta[name="viewport"]');
				if (vp) vp.setAttribute('content', vp.getAttribute('content') + ', maximum-scale=1');
			}
		</script>
		<script>
			// Loopback dev via scripts\run.bat: drop stale service workers so rebuilds show up.
			if (location.hostname === '127.0.0.1' || location.hostname === 'localhost') {
				navigator.serviceWorker?.getRegistrations().then(function (regs) {
					regs.forEach(function (r) {
						r.unregister();
					});
				});
			}
		</script>
		<script>
			// Временный журнал запуска (план 46, «Запуск после фона»): веб-приложение
			// Firefox на Android после долгого простоя закрывается при запуске.
			// Пишем в localStorage сразу, до загрузки приложения: по журналу видно,
			// дошло ли дело до страницы и что было перед закрытием. Читать —
			// /api/diag-boot. Убрать, когда причина найдена.
			(function () {
				var KEY = 'wynd:bootlog';
				var ALIVE = 'wynd:bootlog-alive';
				var id = Math.random().toString(36).slice(2, 6);
				function two(n) {
					return (n < 10 ? '0' : '') + n;
				}
				function stamp(ms) {
					var d = new Date(ms);
					return (
						two(d.getDate()) + '.' + two(d.getMonth() + 1) + ' ' + two(d.getHours()) + ':' +
						two(d.getMinutes()) + ':' + two(d.getSeconds()) + '.' + ('00' + d.getMilliseconds()).slice(-3)
					);
				}
				function log(what) {
					try {
						var list = JSON.parse(localStorage.getItem(KEY) || '[]');
						list.push(stamp(Date.now()) + ' ' + id + ' ' + what);
						localStorage.setItem(KEY, JSON.stringify(list.slice(-200)));
					} catch (e) {
						/* хранилище закрыто — журнала не будет */
					}
				}
				function alive() {
					try {
						localStorage.setItem(ALIVE, String(Date.now()));
					} catch (e) {
						/* то же */
					}
				}
				var nav = '';
				try {
					nav = performance.getEntriesByType('navigation')[0].type;
				} catch (e) {
					/* старый браузер */
				}
				var last = 0;
				try {
					last = Number(localStorage.getItem(ALIVE)) || 0;
				} catch (e) {
					/* то же */
				}
				log(
					'start ' + location.pathname + ' nav=' + nav + ' vis=' + document.visibilityState +
						' app=' + (matchMedia('(display-mode: standalone)').matches ? 1 : 0) +
						' sw=' + (navigator.serviceWorker && navigator.serviceWorker.controller ? 1 : 0) +
						' discarded=' + (document.wasDiscarded ? 1 : 0) + ' hist=' + history.length +
						' prev-alive=' + (last ? stamp(last) : '-')
				);
				alive();
				setInterval(alive, 5000);
				document.addEventListener('DOMContentLoaded', function () {
					log('dom');
				});
				addEventListener('load', function () {
					log('load');
				});
				document.addEventListener('visibilitychange', function () {
					log(document.visibilityState);
					alive();
				});
				addEventListener('pagehide', function (e) {
					log('pagehide persisted=' + (e.persisted ? 1 : 0));
				});
				addEventListener('pageshow', function (e) {
					log('pageshow persisted=' + (e.persisted ? 1 : 0));
				});
				document.addEventListener('freeze', function () {
					log('freeze');
				});
				document.addEventListener('resume', function () {
					log('resume');
				});
				addEventListener('error', function (e) {
					log('error ' + String(e.message || (e.target && (e.target.src || e.target.href)) || '').slice(0, 160));
				}, true);
				addEventListener('unhandledrejection', function (e) {
					log('rejection ' + String((e.reason && e.reason.message) || e.reason).slice(0, 160));
				});
				window.__wyndBoot = log;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
