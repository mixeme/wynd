# Wynd reverse proxy for Apache 2.4 (mod_proxy_http, mod_ssl, mod_headers,
# mod_rewrite, mod_setenvif). Replace example.org and the certificate paths.
#   a2enmod proxy proxy_http ssl headers rewrite setenvif
#
# Client IP: mod_proxy appends the client address to X-Forwarded-For.
# The client's own header is dropped first, so it cannot pick its rate-limit
# bucket. WYND_TRUSTED_PROXIES must list the address Apache connects from
# (loopback — the default; for Docker — the gateway of the container network).

<VirtualHost *:80>
    ServerName example.org
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName example.org
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/example.org/privkey.pem

    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPreserveHost On
    ProxyPass        "/" "http://127.0.0.1:7676/" timeout=300 flushpackets=on
    ProxyPassReverse "/" "http://127.0.0.1:7676/"

    LimitRequestBody 104857600
    # mod_deflate buffers streamed responses: keep SSE and probes uncompressed.
    SetEnvIfNoCase Accept "text/event-stream" no-gzip
    SetEnvIf Request_URI "^/api/v1/probe/" no-gzip

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
</VirtualHost>
