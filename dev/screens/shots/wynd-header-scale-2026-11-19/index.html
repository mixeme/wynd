<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Высота шапок Wynd</title>
<style>
	body { margin: 24px auto; padding: 0 16px; max-width: 1140px; background: #f4f0e9; color: #211e1c; font: 16px/1.45 system-ui, sans-serif; }
	h1 { margin: 0 0 4px; font-size: 26px; }
	p { margin: 0 0 20px; color: #605952; }
	section { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); gap: 24px; }
	figure { margin: 0; }
	figcaption { margin: 0 0 8px; font-weight: 600; }
	img { display: block; width: 100%; height: auto; border: 1px solid #dcd3c7; box-sizing: border-box; }
	a { color: inherit; text-underline-offset: .15em; }
	.before { display: inline-block; margin-top: 6px; font-weight: 400; }
</style>
<h1>Высота шапок Wynd</h1>
<p>Штатные экраны при ширине 360 CSS px и светлой теме. Нажмите на снимок, чтобы открыть его целиком.</p>
<section>
	<figure>
		<figcaption>48 px · Улочка</figcaption>
		<a href="ladder-street.png"><img src="ladder-street.png" alt="Улочка со списком кругов" width="720" height="1456"></a>
	</figure>
	<figure>
		<figcaption>48 px · Настройки</figcaption>
		<a href="ladder-settings.png"><img src="ladder-settings.png" alt="Настройки Wynd со стрелкой назад" width="720" height="1456"></a>
		<a class="before" href="current-settings.png">Текущий вариант · 45,64 px</a>
	</figure>
	<figure>
		<figcaption>48 px · Новая запись</figcaption>
		<a href="ladder-compose.png"><img src="ladder-compose.png" alt="Редактор новой записи с фото и видео" width="720" height="1456"></a>
		<a class="before" href="current-compose.png">Текущий вариант · 52 px</a>
	</figure>
	<figure>
		<figcaption>≈60 px · Общий поиск</figcaption>
		<a href="ladder-search.png"><img src="ladder-search.png" alt="Общий поиск с полем в шапке" width="720" height="1456"></a>
	</figure>
	<figure>
		<figcaption>60 px · Обсуждение</figcaption>
		<a href="ladder-circle.png"><img src="ladder-circle.png" alt="Экран обсуждения без вкладок" width="720" height="1456"></a>
	</figure>
	<figure>
		<figcaption>48 + ≈45 px · Круг с вкладками</figcaption>
		<a href="ladder-circle-tabs.png"><img src="ladder-circle-tabs.png" alt="Круг с пятью вкладками, открыта вкладка «Дни»" width="720" height="1456"></a>
	</figure>
</section>
</html>
