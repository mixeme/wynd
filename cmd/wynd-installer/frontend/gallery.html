<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<title>Стенд Мастерской</title>
		<style>
			/* Окно — постоянного размера, как у собранной Мастерской: снимок не
			   зависит от размера вкладки. */
			html, body { height: auto; }
			#frame { width: 900px; height: 640px; overflow: hidden; position: relative; }
			#report { font: 12px/1.5 monospace; white-space: pre-wrap; padding: 8px; max-width: 900px; }
			#report a { margin-right: 6px; }
			#report a.on { font-weight: bold; }
		</style>
	</head>
	<body>
		<div id="frame"></div>
		<div id="report"></div>
		<script type="module" src="/src/gallery/main.ts"></script>
	</body>
</html>
