<!--
  Wynd — логотип. Знак плюс слово, слово в кривых: шрифт в файле не нужен.

  Знак     контур из docs/wynd.html, один в один, в своих координатах.
  Слово    «Wynd», Nothing You Could Do, переведён в кривые. Кегль 52.756 —
           тот, при котором чернильная высота слова равна чернильной высоте знака.
  Лок      чернильные высоты равны (61.474), чернильные центры совмещены,
           зазор между чернилами 21.516 = 0.35 высоты. Габарит 178.74 x 61.47,
           пропорция 2.908 : 1. Поля в файле нет — оно задаётся при вёрстке,
           не меньше того же зазора со всех сторон.
  Цвет     чернила #2B2724. Логотип не выворачивается и не перекрашивается;
           если нужен цвет круга — это не логотип, а знак, см. mark.svg.
  Размер   ниже 48 px по высоте знака тонкий конец пера бледнеет; ниже 32 px
           лок не набирается — ставится знак без слова.

  Правила и построение: docs/visual/logo.html
-->
