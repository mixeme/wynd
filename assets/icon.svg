<!--
  Wynd — эталон иконки. Всё остальное (png, ico, icns, maskable) выводится отсюда.

  Знак     петляющая улочка: два изгиба, концы на оси, амплитуда постоянная,
           перо режется от 0.62 к 2.38 — глубина даётся весом линии, а не наклоном.
  Источник docs/wynd.html, <svg> в шапке, viewBox -21.67 -31.78 42.9 64.34.
           Контур перенесён один в один: масштаб 12.29786, сдвиг (514.71, 506.61).
  Сетка    1024, знак 756 по высоте (портретный прямоугольник сетки Apple),
           492 по ширине, оптический центр совмещён с центром холста.
           Знак укладывается в круг d=756 < 819 — safe zone maskable-иконки Android.
  Цвет     бумага #F4F0E9, чернила #2B2724. Подложка сплошная и во всё поле:
           iOS не допускает прозрачности, Android режет углы сам.
  Мелкие   до 32 px включительно — icon-small.svg: то же перо с поднятым
  размеры  минимумом, иначе тонкий конец линии пропадает.
-->
