Description: |
  Wynd is a private journal for your close circle: family, friends, colleagues.

  This app is the Android client. It does not include a server and has no
  accounts of its own: it connects to a Wynd server run by you or by someone you
  trust. The server is free software too (AGPL-3.0), from the same source
  repository.

  A circle is a closed group with its own journal, its own name and its own
  visibility. A person can be in several circles and appear differently in each.
  You join by an invitation link or QR code from someone already in the circle;
  there is no public feed, no followers and no recommendations.

  The app reads and writes the journal by days, shows photos and video in a grid
  and on a map, searches by words, dates, place and author, keeps recent posts on
  the phone, sends posts written without a network when it returns, and can open
  a circle's full archive (.wynd). Notifications are optional and go through
  UnifiedPush instead of Google services. There is no tracking, no analytics and
  no advertising.

  You need a server: run the Wynd server on your own machine, a VPS or at home.
  Docker images and instructions are in the server repository.

  Builds published on F-Droid are signed with F-Droid's key. An APK installed
  from the project's own releases cannot be updated by this one, and the other
  way round; switching requires removing the old app and installing again.

RepoType: git
Repo: https://github.com/mixeme/wynd

Builds:
  - versionName: 0.1.3
    versionCode: 1003
    commit: android-v0.1.3
    subdir: android
    sudo:
      - apt-get update || apt-get update
      - apt-get install -y npm
    gradle:
      - fdroid
    output: app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
    prebuild: cd ../web && npm ci
    scanignore:
      - web/node_modules
    gradleprops:
      - wyndEmbeddedUi=true

AutoUpdateMode: None
UpdateCheckMode: None
