plugins {
    id 'com.android.application'
}

def environmentRoot = providers.gradleProperty('wyndEnvironmentRoot')
        .orElse(providers.environmentVariable('WYND_ANDROID_ENV'))
        .orElse('D:/android-env')
def startUrl = providers.gradleProperty('wyndDevServerUrl').orElse('')
// Подготовка вшитого интерфейса (план 50, схема Настольного): клиент в APK
// и режим embedded включаются только этим свойством. По умолчанию интерфейс
// приходит с сервера, поэтому обычные APK не растут и не меняются.
def embeddedUi = providers.gradleProperty('wyndEmbeddedUi')
        .map { it.toBoolean() }
        .orElse(false)
        .get()
def fixtureOrigin = providers.gradleProperty('wyndUpdateFixtureOrigin').orElse('')
def versionProperties = new Properties()
rootProject.file('version.properties').withInputStream { versionProperties.load(it) }
def appVersion = providers.gradleProperty('wyndVersionName').orElse(versionProperties.getProperty('versionName')).get()
if (!(appVersion ==~ /(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)/)) throw new GradleException('Invalid Android version')
def versionParts = appVersion.split(/\./).collect { new BigInteger(it) }
def appVersionCode = versionParts[0] * 1000000 + versionParts[1] * 1000 + versionParts[2]
if (versionParts[1] > 999 || versionParts[2] > 999 || appVersionCode <= 0 || appVersionCode > 2100000000) throw new GradleException('Android version overflow')
def generatedResources = layout.buildDirectory.dir('generated/wynd-res')

android {
    namespace 'mixeme.wynd'
    compileSdk 36

    defaultConfig {
        applicationId 'mixeme.wynd'
        minSdk 21
        targetSdk 36
        versionCode appVersionCode.intValue()
        versionName appVersion
        buildConfigField 'String', 'APP_VERSION', groovy.json.JsonOutput.toJson(appVersion)
        buildConfigField 'boolean', 'EMBEDDED_UI', embeddedUi.toString()
    }

    // Редакция владельца с самообновлением из GitHub-выпусков — и редакция F-Droid,
    // где код обновления не входит в APK и разрешение установки убрано (план 67).
    flavorDimensions = ['distribution']
    productFlavors {
        standard { dimension 'distribution' }
        fdroid { dimension 'distribution' }
    }

    signingConfigs {
        debug {
            // Только отладочный ключ. Ключ выпуска определяет и хранит владелец.
            storeFile file("${environmentRoot.get()}/keys/wynd-debug.keystore")
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            // JSON quoting also produces a valid Java string literal.
            buildConfigField 'String', 'START_URL', groovy.json.JsonOutput.toJson(startUrl.get())
            buildConfigField 'String', 'UPDATE_FIXTURE_ORIGIN', groovy.json.JsonOutput.toJson(fixtureOrigin.get())
        }
        release {
            // CI готовит unsigned APK; постоянный ключ остаётся у владельца.
            buildConfigField 'String', 'START_URL', '""'
            buildConfigField 'String', 'UPDATE_FIXTURE_ORIGIN', '""'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets.main.res.srcDir(generatedResources)
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/startup-assets'))
    if (embeddedUi) sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/embedded-assets'))
    lint {
        abortOnError true
        warningsAsErrors true
        // Версии закреплены по проверенной таблице совместимости JDK 17 / AGP.
        disable 'AndroidGradlePluginVersion'
        lintConfig file('lint.xml')
    }
}

tasks.register('prepareWyndIcon', Sync) {
    inputs.file(rootProject.file('../assets/icon-small.svg'))
    inputs.file(rootProject.file('../assets/icon-android-foreground.png'))
    inputs.file(rootProject.file('../web/static/icon-192-rounded.png'))
    into(generatedResources)
    // До Android 8 — готовая скруглённая плитка; с 8 (anydpi-v26) — adaptive:
    // лаунчер сам режет бумагу по своей маске, белой плашки вокруг нет.
    from(rootProject.file('../web/static/icon-192-rounded.png')) {
        into 'mipmap-nodpi'
        rename { 'ic_launcher.png' }
    }
    from(rootProject.file('../assets/icon-android-foreground.png')) {
        into 'drawable-nodpi'
        rename { 'wynd_icon_foreground.png' }
    }
    doLast {
        // Тот же утверждённый знак для маленьких размеров, без подложки;
        // Android требует белый силуэт для системных уведомлений.
        def svg = new groovy.xml.XmlSlurper(false, false).parse(rootProject.file('../assets/icon-small.svg'))
        if (svg.@viewBox.text() != '0 0 1024 1024' || svg.path.size() != 1) throw new GradleException('Unexpected Wynd small icon')
        def target = generatedResources.get().file('drawable/wynd_notification.xml').asFile
        target.parentFile.mkdirs()
        // Единственный неанимированный 24dp-контур: не упрощать утверждённый знак ради lint.
        target.setText('<vector xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools" android:width="24dp" android:height="24dp" android:viewportWidth="1024" android:viewportHeight="1024">'
                + '<path tools:ignore="VectorPath" android:fillColor="#FFFFFFFF" android:pathData="' + svg.path[0].@d.text() + '"/></vector>', 'UTF-8')
        // Adaptive-иконка: бумага — цветом, знак — отдельным слоем в safe zone.
        def color = generatedResources.get().file('values/wynd_icon.xml').asFile
        color.parentFile.mkdirs()
        color.setText('<resources><color name="wynd_icon_background">#F4F0E9</color></resources>', 'UTF-8')
        def adaptive = generatedResources.get().file('mipmap-anydpi-v26/ic_launcher.xml').asFile
        adaptive.parentFile.mkdirs()
        adaptive.setText('<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/wynd_icon_background"/><foreground android:drawable="@drawable/wynd_icon_foreground"/><monochrome android:drawable="@drawable/wynd_icon_foreground"/></adaptive-icon>', 'UTF-8')
    }
}
tasks.register('prepareStartupSync', Exec) {
    workingDir rootProject.file('../web')
    // tsconfig веб-проекта расширяет сгенерированный .svelte-kit/tsconfig.json;
    // на свежем каталоге (CI, новая машина) его нет, поэтому sync перед сборкой.
    commandLine 'node', 'node_modules/@sveltejs/kit/svelte-kit.js', 'sync'
    inputs.file(rootProject.file('../web/svelte.config.js'))
    outputs.file(rootProject.file('../web/.svelte-kit/tsconfig.json'))
}
tasks.register('prepareStartupAssets', Exec) {
    dependsOn('prepareStartupSync')
    workingDir rootProject.file('../web')
    commandLine 'node', 'node_modules/vite/bin/vite.js', 'build', '--config', 'vite.android-startup.config.ts'
    inputs.files(fileTree(rootProject.file('../web/src')), rootProject.file('../web/vite.android-startup.config.ts'), rootProject.file('../web/package-lock.json'))
    inputs.dir(rootProject.file('../web/static/fonts'))
    inputs.file(rootProject.file('../web/static/icons.svg'))
    outputs.dir(layout.buildDirectory.dir('generated/startup-assets'))
}
tasks.register('prepareEmbeddedWeb', Exec) {
    // Полный клиент, а не только стартовые экраны. Сборка идёт после стартовой,
    // чтобы две vite-сборки не делили .svelte-kit одновременно.
    dependsOn('prepareStartupSync', 'prepareStartupAssets')
    workingDir rootProject.file('../web')
    commandLine 'node', 'node_modules/vite/bin/vite.js', 'build'
    inputs.files(fileTree(rootProject.file('../web/src')), rootProject.file('../web/vite.config.ts'),
            rootProject.file('../web/svelte.config.js'), rootProject.file('../web/package-lock.json'))
    inputs.dir rootProject.file('../web/static')
    outputs.dir rootProject.file('../web/dist')
}
tasks.register('prepareEmbeddedAssets', Sync) {
    dependsOn('prepareEmbeddedWeb')
    into layout.buildDirectory.dir('generated/embedded-assets/www')
    from(rootProject.file('../web/dist')) {
        // aapt выкидывает каталоги, начинающиеся с «_» (шаблон <dir>_*),
        // а клиенту нужен /_app/…: в APK каталог лежит как app/…,
        // EmbeddedAssets.storagePath возвращает ему прежний путь.
        eachFile { details ->
            if (details.path == '_app' || details.path.startsWith('_app/')) {
                details.path = 'app' + details.path.substring(4)
            }
        }
    }
}
tasks.named('preBuild').configure {
    dependsOn('prepareWyndIcon', 'prepareStartupAssets')
    if (embeddedUi) dependsOn('prepareEmbeddedAssets')
}

dependencies {
    // Последний стабильный WebKit для minSdk 21; нужен origin-bound мост,
    // а не addJavascriptInterface, доступный всем фреймам страницы.
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'org.unifiedpush.android:connector:3.3.5'
    // Фоновая отправка очереди после закрытия окна (план 50, этап 5):
    // WorkManager, без Google Play Services.
    implementation 'androidx.work:work-runtime:2.10.0'
    // Фоновое сжатие офлайн-видео (план 50, 5.3): Media3 Transformer
    // перекодирует через MediaCodec; ffmpeg и сервер не участвуют.
    implementation 'androidx.media3:media3-transformer:1.5.1'
    implementation 'androidx.media3:media3-effect:1.5.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
