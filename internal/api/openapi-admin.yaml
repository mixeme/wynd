openapi: 3.1.0
info:
  title: Wynd admin API
  version: 0.28.7
  description: Admin routes (Bearer admin session). Participant routes are in openapi-participant.yaml.

servers:
  - url: /api/v1

security:
  - bearerAuth: []

paths:
  /admin/login:
    post:
      summary: Admin login
      security: []
      responses:
        "200":
          description: Admin session token

  /admin/logout:
    post:
      summary: Revoke the current admin session
      responses:
        "200":
          description: OK

  /admin/bootstrap:
    post:
      summary: First-run bootstrap
      security: []
      responses:
        "200":
          description: OK

  /admin/bootstrap/smtp-test:
    post:
      summary: Probe SMTP with unsaved settings during first-run bootstrap
      security: []
      responses:
        "200":
          description: OK

  /admin/storage:
    get:
      summary: Instance storage usage and quota
      responses:
        "200":
          description: used_bytes, quota_bytes (effective), storage_quota_bytes, storage_quota_disk_percent, circles[]

  /admin/storage/quota:
    put:
      summary: Set instance storage quota (absolute bytes or disk percent, not both)
      responses:
        "200":
          description: OK

  /admin/storage/default_quota:
    put:
      summary: Set default per-circle media quota
      responses:
        "200":
          description: OK

  /admin/circles/{id}/quota:
    put:
      summary: Set circle-specific quota override
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK

  /admin/compression:
    get:
      summary: Client compression thresholds
      responses:
        "200":
          description: Compression settings
    put:
      summary: Update compression thresholds
      responses:
        "200":
          description: OK

  /admin/access:
    get:
      summary: Instance name, public URL and registration mode
      responses:
        "200":
          description: Access settings
    put:
      summary: Update instance name, public URL and/or registration mode
      responses:
        "200":
          description: OK

  /admin/password:
    put:
      summary: Change admin panel password
      responses:
        "200":
          description: OK

  /admin/accounts:
    get:
      summary: Account list (email and circle count only)
      responses:
        "200":
          description: accounts[]

  /admin/accounts/{id}:
    get:
      summary: Account detail for admin people card
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account detail
    delete:
      summary: Soft-delete account (not circle owners)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "409":
          description: Account owns a circle

  /admin/accounts/{id}/block:
    post:
      summary: Close login for an account (no hard-delete)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK

  /admin/accounts/{id}/email:
    put:
      summary: Change the account email without a code; revokes all its sessions, mails both addresses
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: New email
        "400":
          description: Not an address, or the current one
        "409":
          description: The address already belongs to another account

  /admin/accounts/{id}/unblock:
    post:
      summary: Reopen login for an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK

  /admin/invites:
    get:
      summary: Server invites
      responses:
        "200":
          description: invites[]
    post:
      summary: Create server invite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum: [single, multi]
                max_uses:
                  type: integer
                  minimum: 1
                  maximum: 1000
                ttl_sec:
                  type: integer
                  minimum: 1
                  maximum: 31536000
                unlimited_uses:
                  type: boolean
                  description: multi only; stored as max_uses 2147483647 (admin server invites only)
                no_expiry:
                  type: boolean
                  description: stored as expires_at 9999-12-31 (admin server invites only)
      responses:
        "201":
          description: Invite created
        "400":
          description: max_uses above 1000 or ttl_sec above 365 days are refused

  /admin/invites/{id}:
    delete:
      summary: Revoke server invite
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK

  /admin/smtp:
    get:
      summary: SMTP settings (password omitted)
      responses:
        "200":
          description: SMTP config
    put:
      summary: Save SMTP settings
      responses:
        "200":
          description: OK

  /admin/smtp/test:
    post:
      summary: Send test email
      responses:
        "200":
          description: OK

  /admin/push/vapid:
    get:
      summary: VAPID public key
      responses:
        "200":
          description: public_key

  /admin/push/test:
    post:
      summary: Send test push to this browser's subscription (endpoint, p256dh, auth in body; not stored)
      responses:
        "200":
          description: OK
        "409":
          description: push_no_subscriptions — no subscription in body and none stored
        "502":
          description: push_failed — the push service refused the delivery

  /admin/check:
    post:
      summary: Run instance checks (optional external report in body)
      responses:
        "200":
          description: checks[]

  /admin/proxy/{kind}:
    get:
      summary: Reverse proxy snippet (nginx, caddy, traefik, apache)
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [nginx, caddy, traefik, apache]
      responses:
        "200":
          description: snippet text

  /admin/quota_requests:
    get:
      summary: Pending circle quota extension requests
      responses:
        "200":
          description: requests[]

  /admin/quota_requests/{id}/approve:
    post:
      summary: Approve quota request
      responses:
        "200":
          description: OK

  /admin/quota_requests/{id}/reject:
    post:
      summary: Reject quota request
      responses:
        "200":
          description: OK

  /admin/pay:
    get:
      summary: Payment hub settings
      responses:
        "200":
          description: requisites and summaries
    put:
      summary: Update payment requisites
      responses:
        "200":
          description: OK

  /admin/pay/donate:
    get:
      summary: Donate banner settings
      responses:
        "200":
          description: text, show, dismissible, until
    put:
      summary: Update donate banner settings
      responses:
        "200":
          description: OK

  /admin/pay/subscription:
    get:
      summary: Subscription gate settings
      responses:
        "200":
          description: required, remind_days
    put:
      summary: Update subscription gate settings
      responses:
        "200":
          description: OK

  /admin/pay/requests:
    get:
      summary: Pending subscription payment requests
      responses:
        "200":
          description: requests[]

  /admin/pay/requests/{id}:
    get:
      summary: Payment request detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: request

  /admin/pay/requests/{id}/approve:
    post:
      summary: Approve payment request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                days:
                  type: integer
                unlimited:
                  type: boolean
      responses:
        "200":
          description: OK

  /admin/pay/requests/{id}/reject:
    post:
      summary: Reject payment request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK

  /admin/pay/accounts:
    get:
      summary: Accounts with subscription status for admin table
      responses:
        "200":
          description: accounts[]

  /admin/pay/accounts/{id}:
    get:
      summary: Account email and subscription for grant screen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: account
    put:
      summary: Grant or extend subscription without a pay request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                days:
                  type: integer
                unlimited:
                  type: boolean
      responses:
        "200":
          description: OK

  /admin/pay/blob/{blob_id}:
    get:
      summary: Pay request screenshot for admin review
      parameters:
        - name: blob_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: image bytes

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
