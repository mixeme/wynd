openapi: 3.1.0
info:
  title: Wynd participant API
  version: 0.42.2
  description: Participant routes (Bearer session). Admin routes are in a separate spec.

servers:
  - url: /api/v1

security:
  - bearerAuth: []

paths:
  /instance:
    get:
      summary: Public instance info
      security: []
      responses:
        "200":
          description: >-
            Instance name, version, registration mode, loopback, bootstrapped,
            code_delivery (`log` on loopback without SMTP, else `mail`), and
            source_url — the Corresponding Source address the client links to
            (AGPL 13).

  /probe:
    get:
      summary: Reverse-proxy diagnostics for admin browser checks
      security: []
      responses:
        "200":
          description: proto, peer_loopback, body_probe_bytes for PUT /probe/body, and instance — a per-process tag the admin check sends back to confirm the domain

  /probe/sse:
    get:
      summary: SSE buffering probe for admin browser checks
      security: []
      responses:
        "200":
          description: text/event-stream with one event

  /probe/stream:
    get:
      summary: Slow response stream probe for proxy read timeout checks
      security: []
      responses:
        "200":
          description: chunked octet stream (~2s)

  /probe/body:
    put:
      summary: Request body limit probe for admin browser checks
      security: []
      responses:
        "200":
          description: body accepted
        "413":
          description: body too large

  /sync:
    get:
      summary: Events after cursor in visible spans
      parameters:
        - name: cursor
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: SSE stream — hello frame with max_seq, then sync frames
          content:
            text/event-stream:
              schema:
                type: string
        "406":
          description: Accept without text/event-stream

  /circles:
    get:
      summary: Account circles with unread counts
      responses:
        "200":
          description: >-
            Circle list. Each circle carries pinned_at (RFC 3339) when the account
            pinned it; groups[] — the account's street groups on this server
            ({name, circle_ids[]}, by name; an empty group is never stored).
    post:
      summary: Create circle
      responses:
        "201":
          description: Circle created

  /circles/{circle_id}/invites:
    get:
      summary: Live circle invites
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: invites[]
    post:
      summary: Create circle invite
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum: [single, multi]
                max_uses:
                  type: integer
                  minimum: 1
                  maximum: 1000
                ttl_sec:
                  type: integer
                  minimum: 1
                  maximum: 31536000
      responses:
        "201":
          description: Invite token
        "400":
          description: >-
            kind=multi is invalid when the circle allows only single invites;
            max_uses above 1000 or ttl_sec above 365 days are refused;
            unlimited_uses / no_expiry are admin-only and ignored here

  /circles/{circle_id}/invite-candidates:
    get:
      summary: People from inviter's other circles
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: groups[]

  /circles/{circle_id}/member-invites:
    post:
      summary: Personal invite for an existing account
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id]
              properties:
                account_id:
                  type: string
      responses:
        "201":
          description: invited

  /circles/{circle_id}/join-preview:
    get:
      summary: Join screen preview for pending personal invite
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >
            peek fields; for a circle split off another (A9) also `split` —
            split_from, invite_line, you_name, past_from

  /circles/{circle_id}/split:
    get:
      summary: What a split takes (posts seen, since when) and whom to call (A9)
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: posts, since, people
        "403":
          description: not an active member
    post:
      summary: Split off a new circle from what the member has seen; invites the chosen people (A9)
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                invite:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: circle_id, posts, invited
        "400":
          description: empty name or someone not in the circle
        "403":
          description: not an active member

  /circles/{circle_id}/join:
    post:
      summary: Complete pending circle join (name in circle)
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                body:
                  type: string
      responses:
        "200":
          description: OK

  /pending-circle-joins:
    get:
      summary: Circles awaiting join naming for session
      responses:
        "200":
          description: circle_ids[]

  /circles/{circle_id}/invites/{id}:
    delete:
      summary: Revoke circle invite
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK

  /circles/{circle_id}/leave:
    post:
      summary: Leave circle (retain_access keeps read until leave)
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK

  /circles/{circle_id}/read_cursor:
    put:
      summary: Advance read cursor for unread badge
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seq]
              properties:
                seq:
                  type: integer
      responses:
        "200":
          description: OK

  /circles/{circle_id}/pin:
    put:
      summary: Pin the circle on the street (plan 46, A2)
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pinned_at:
                  type: string
                  format: date-time
                  description: When it was pinned on the device; empty or future — now
      responses:
        "200":
          description: OK
        "403":
          description: The account left the circle for good
        "404":
          description: Not a member
    delete:
      summary: Unpin the circle
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK (also when it was not pinned)

  /circles/{circle_id}/group:
    put:
      summary: Put the circle into the account's group by name (created if missing; moved out of its former group)
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 100
      responses:
        "200":
          description: OK
        "400":
          description: Empty or too long name
        "403":
          description: The account left the circle for good
        "404":
          description: Not a member
    delete:
      summary: Take the circle out of its group; a group left empty is gone
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK (also when it was in no group)

  /circles/{circle_id}/responses:
    get:
      summary: Responses tab — others' comments, reactions, day titles and covers, newest first
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
        - name: before
          in: query
          required: false
          schema:
            type: integer
          description: Page older than this seq
      responses:
        "200":
          description: items, posts (refs by id), day_posts, read_seq, has_more

  /circles/{circle_id}/responses/read:
    put:
      summary: Advance the responses read mark (tab count, street dot)
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seq]
              properties:
                seq:
                  type: integer
      responses:
        "200":
          description: OK

  /circles/{circle_id}/feed:
    get:
      summary: Feed snapshot trimmed to visible spans
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
        - name: before
          in: query
          description: Cursor from next_before of the previous page; omitted — newest page
          schema:
            type: string
      responses:
        "200":
          description: Posts with media, comments, reactions; next_before when older items remain

  /circles/{circle_id}/grid:
    get:
      summary: Photo grid snapshot
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
        - name: before
          in: query
          description: Cursor from next_before of the previous page; omitted — newest page
          schema:
            type: string
      responses:
        "200":
          description: Photo tiles; next_before when older items remain

  /circles/{circle_id}/map:
    get:
      summary: Map pins snapshot
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
        - name: before
          in: query
          description: Cursor from next_before of the previous page; omitted — newest page
          schema:
            type: string
      responses:
        "200":
          description: Geotagged media; next_before when older items remain

  /circles/{circle_id}/days:
    get:
      summary: Days with visible posts
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Day summaries

  /circles/{circle_id}/days/{date}:
    get:
      summary: Posts for one day by entry_date
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Day posts ordered by created_at

  /circles/{circle_id}/search/authors:
    get:
      summary: Distinct author names in circle search hits
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: has_photo
          in: query
          schema:
            type: string
            enum: ["1"]
        - name: has_location
          in: query
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Author names from FTS matches

  /circles/{circle_id}/search:
    get:
      summary: Full-text search in circle (with author)
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: has_photo
          in: query
          schema:
            type: string
            enum: ["1"]
        - name: has_location
          in: query
          schema:
            type: string
            enum: ["1"]
        - name: author
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Search hits — kind post, comment, day, file (attachment by file name) or audio (by title, artist or file name); file and audio carry media_id and media_blob_id

  /search:
    get:
      summary: Full-text search across all circles (no author)
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: has_photo
          in: query
          schema:
            type: string
            enum: ["1"]
        - name: has_location
          in: query
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Search hits — kind post, comment, day, file (attachment by file name) or audio (by title, artist or file name); file and audio carry media_id and media_blob_id

  /auth/register:
    post:
      summary: Register account (open mode)
      security: []
      responses:
        "202":
          description: Code sent

  /auth/code:
    post:
      summary: Request login code
      security: []
      responses:
        "202":
          description: Code sent

  /auth/verify:
    post:
      summary: Verify code and receive Bearer token
      security: []
      responses:
        "200":
          description: Session

  /auth/logout:
    post:
      summary: Revoke the current participant session
      responses:
        "200":
          description: OK

  /auth/email:
    post:
      summary: Send a code to the new email of the signed-in account
      responses:
        "202":
          description: Code sent to the new address; nothing changes until it is entered
        "400":
          description: Not an address, or the current one
        "409":
          description: The address already belongs to an account on this server
        "429":
          description: Rate limited

  /auth/email/verify:
    post:
      summary: Change the account email with the code from the new address
      responses:
        "200":
          description: New email; this session stays, the other sessions of the account are revoked
        "400":
          description: Wrong code
        "404":
          description: No code was requested
        "409":
          description: The address was taken meanwhile
        "410":
          description: Code expired
        "429":
          description: Attempts used up or rate limited

  /auth/leave:
    get:
      summary: What the leave screen shows (7.29, 7.30)
      description: >
        `{"circles": n, "owned": [{"id", "name", "members"}]}` — active circles
        of the caller and the circles they own (must be transferred or deleted
        before leaving).
      responses:
        "200":
          description: Preview
    post:
      summary: Leave this server for good (screens 7.29–7.32)
      description: >
        Deletes the caller's account on this server; nothing is removed from
        circles. Body `{"erase_names": bool}` — erase names, photos and gender
        in every circle of the server; allowed only when the admin enabled
        `allow_name_erasure`.
      responses:
        "200":
          description: Account deleted, all sessions revoked
        "403":
          description: Name erasure is not allowed on this server
        "409":
          description: The caller owns circles — transfer or delete them first

  /invites/{token}:
    get:
      summary: Public invite preview
      security: []
      responses:
        "200":
          description: Circle invite metadata, or server invite (server_name, host, inviter_name) without a circle
        "400":
          description: Invite revoked or already used up
        "410":
          description: Invite expired

  /invites/{token}/claim:
    post:
      summary: Take a circle invite with the current session
      responses:
        "200":
          description: Circle id and whether the account is already a member
        "400":
          description: Server invite, or invite invalid
        "403":
          description: Personal invite for another account

  /invites/{token}/join:
    post:
      summary: Complete deferred circle join after verify
      responses:
        "200":
          description: Joined

  /invites/{token}/accept:
    post:
      summary: Accept invite
      security: []
      responses:
        "202":
          description: Code sent

  /uploads:
    post:
      summary: Create blob upload session
      responses:
        "201":
          description: Upload session

  /uploads/{session_id}:
    head:
      summary: Upload resume status
    put:
      summary: Upload chunk

  /uploads/{session_id}/complete:
    post:
      summary: Complete upload

  /blobs/{blob_id}:
    get:
      summary: Download blob (attachment)

  /circles/{circle_id}/posts:
    post:
      summary: Create post
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Post created

  /circles/{circle_id}/posts/{post_id}:
    patch:
      summary: Edit post
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                entry_date:
                  type: string
                cover_blob_id:
                  type: string
                media:
                  description: >-
                    Omitted — media untouched; present — replaces the whole set.
                    Together with cover_blob_id it is invalid: media carries the
                    cover itself.
                  type: array
                  items:
                    type: object
    delete:
      summary: Delete post branch

  /circles/{circle_id}/posts/{post_id}/comments:
    post:
      summary: Add comment

  /circles/{circle_id}/posts/{post_id}/comments/{comment_id}:
    patch:
      summary: Edit comment
      description: Body {body, media?}. Without media only the words change. With media the list replaces the attachments entirely (photo or attachment, up to 10); new blobs must be the caller's and fit the quota; removed blobs are released. Empty words with no attachments — 400.
    delete:
      summary: Delete comment

  /circles/{circle_id}/posts/{post_id}/reactions:
    put:
      summary: Set reaction
    delete:
      summary: Remove reaction

  /circles/{circle_id}/days/{date}/title:
    put:
      summary: Set day title
    delete:
      summary: Clear day title

  /circles/{circle_id}/days/{date}/cover:
    put:
      summary: Set day cover
    delete:
      summary: Clear day cover

  /circles/{circle_id}:
    get:
      summary: Circle detail with archive cycle banner
    patch:
      summary: Rename circle or change edit window (can_settings)
    delete:
      summary: Delete circle with name confirmation (owner)

  /circles/{circle_id}/members:
    get:
      summary: List circle members

  /circles/{circle_id}/members/{account_id}:
    put:
      summary: Set member can_settings (owner)

  /circles/{circle_id}/identity:
    get:
      summary: Identity name history in circle
    put:
      summary: Update identity name and/or avatar in circle

  /circles/{circle_id}/place:
    put:
      summary: Set own «share place from photos» default in circle (share_place)

  /circles/{circle_id}/transfer:
    post:
      summary: Transfer circle ownership (owner)

  /circles/{circle_id}/exclude:
    post:
      summary: Exclude member from circle (owner)

  /circles/{circle_id}/quota:
    get:
      summary: Used bytes, quota and media volume chart (owner)
      description: volume_step (day, week, month) follows circle age; each volume period is its start date.
      parameters:
        - name: cutoff_date
          in: query
          description: With it the answer also carries freed_at_cutoff_bytes and posts_kept_at_cutoff.
          schema:
            type: string
            format: date

  /circles/{circle_id}/full_archive:
    get:
      summary: Full circle archive state and estimate (owner)
      description: estimate_bytes, posts, members, fits (room on the server for a ready file), retention_hours and the latest archive (status building, ready, failed or removed with removed_reason).
    post:
      summary: Build the full circle archive in the background (owner)
      description: Body {delete_circle, key?} — delete_circle freezes the circle (nobody writes, members get one email and may download their own archive); key is {public_key, salt, log_n} of an X25519 key the device derived from the password (scrypt, N = 2^log_n, r = 8, p = 1); the password never reaches the server. 409 archive_busy while one is building or ready; 507 no_room when the ready file does not fit.
    delete:
      summary: Cancel the build or delete the ready file without downloading (owner)

  /circles/{circle_id}/full_archive/link:
    post:
      summary: Link to the ready full archive (owner)
      description: The link lives a day and supports Range; the file is deleted once its last byte is delivered.

  /circles/{circle_id}/full_archive/stream_link:
    post:
      summary: One-time link that builds the full archive straight into the download (owner, no room for a ready file)

  /circles/{circle_id}/full_archive/revive:
    post:
      summary: Cancel the archive with removal and unfreeze the circle (owner)

  /circles/{circle_id}/full_archive/remove_circle:
    post:
      summary: Remove the frozen circle from the server once its archive file was downloaded (owner)
      description: 409 not_downloaded until the last byte of the archive with removal reached the device.

  /circles/{circle_id}/members/invite_waiting:
    post:
      summary: Mail the members who came with a revived or moved circle and never signed in here (6.35); body {identity_id?} — one or all (owner)

  /revive/blobs:
    post:
      summary: Which archive files the caller already has on the server (by sha256) — not uploaded again
      description: Body {sha256 [..]}; answer {blobs {sha256 → blob id}}. Only the caller's own complete blobs.

  /revive/room:
    get:
      summary: Room this server gives a new circle of the caller (default circle quota or an approved request), and the caller's place request (2.22–2.26)
      parameters:
        - name: bytes
          in: query
          schema:
            type: integer

  /revive/invitable:
    post:
      summary: How many archive e-mails have no account on this server (7.29) — they get a letter; 0 hides «Разослать приглашения». Body {emails [..]} up to 500; answer {invitable} — a count only

  /revive/place_request:
    post:
      summary: Ask the admin for room for a circle that does not exist yet (2.23); body {bytes, circle_name}; one pending per account

  /revive:
    post:
      summary: Revive a circle from a full archive (plan 52)
      description: Body {manifest, tables {name → {columns, rows}}, blob_map {archive blob → uploaded blob}, send_invites}. Every archive file must be uploaded by the caller with the same sha256 and size (400 blob_missing / blob_mismatch). New ids for everything; people by e-mail (unknown e-mails get accounts without a login); the caller owns the circle. Answer {circle_id, posts, names, bytes, verified, invited, not_joined, already_here}. Body up to 256 MB.

  /circles/{circle_id}/move:
    get:
      summary: Circle move as the owner sees it (plan 53, 6.24–6.26) — estimate {posts, members, bytes} and the live move or null
    post:
      summary: Freeze the circle and issue a one-time move link (6.24); the link is only in this answer; 409 circle_frozen
  /circles/{circle_id}/move/cancel:
    post:
      summary: Cancel the move (6.25, 6.26) — the link dies, the circle writes again
  /circles/{circle_id}/move/complete:
    post:
      summary: Finish the move after the new server accepted it (6.26) — the circle is deleted here, members get a "circle moved" e-mail; 409 not_accepted

  /move:
    get:
      summary: Server to server — circle card for the new server (2.18); header "Authorization: Move <key>"; status waiting/pulling/accepted/canceled/completed/expired
      security: []
  /move/claim:
    post:
      summary: Server to server — the new server takes the move, body {dest_url, dest_name}; the first address keeps it (409 move_taken), 410 move_expired; starts building the archive
      security: []
  /move/archive:
    get:
      summary: Server to server — the plain .wynd archive with Range; 409 archive_building / archive_failed
      security: []
  /move/accepted:
    post:
      summary: Server to server — "accepted and verified", body {posts, names, bytes}; must match the archive (409 mismatch)
      security: []

  /circles/{circle_id}/arrival/seen:
    post:
      summary: «Войти в круг» on 1.9 — the caller came with a moved or revived circle and has seen the welcome; circle detail stops carrying `arrival`
  /moves/incoming:
    get:
      summary: The caller's latest incoming move (2.18 on open, progress, result 2.19/2.32) with room for it (2.27–2.31); {move} or {move:null, room_bytes}
    post:
      summary: Paste a move link (2.18) — this server asks the old one for the circle card and remembers the link; body {link}; errors link_invalid, move_not_found, source_too_old, move_canceled, move_completed (400), source_unreachable (502), move_busy (409)
  /moves/incoming/{id}/start:
    post:
      summary: «Поднять круг здесь» — body {send_invites}; the server pulls the circle itself with resume and revives it; 507 no_room, 410 move_expired

  /full_archive/{token}:
    get:
      summary: Ready full archive by link
      security: []
      responses:
        "200":
          description: The .wynd file (or 206 for a Range)
        "404":
          description: Link unknown or the file is gone

  /full_archive_stream/{token}:
    get:
      summary: Full archive built straight into the response
      security: []
      responses:
        "200":
          description: The .wynd file
        "404":
          description: Link unknown, used or expired

  /circles/{circle_id}/archive:
    post:
      summary: Start archive cycle (owner)

  /circles/{circle_id}/archive/cutoff:
    put:
      summary: Move cutoff before first download (owner)

  /circles/{circle_id}/archive/deadline:
    put:
      summary: Move archive deadline (owner)

  /circles/{circle_id}/archive/download:
    get:
      summary: Download personal archive ZIP
      parameters:
        - name: layout
          in: query
          schema:
            type: string
            enum: [feed, posts]
      description: >
        Streamed as it is built (nothing is stored on the server); Content-Length
        is exact. No Range — an interrupted download starts over. During an
        archive cycle — up to its cutoff (a full delivery locks the cutoff);
        otherwise at any time — everything the person saw in the circle, and
        nothing gets locked.

  /circles/{circle_id}/archive/link:
    post:
      summary: One-time link to the personal archive (lives one minute)
      description: >
        Returns `{"url": "/api/v1/archive/{token}"}`; the browser downloads it
        natively, without the session header. Query `layout` as for download.

  /archive/{token}:
    get:
      summary: Personal archive by a one-time link
      security: []
      responses:
        "200":
          description: ZIP stream
        "404":
          description: Link unknown, used or expired

  /groups/rename:
    post:
      summary: Rename the account's group on this server; into an existing name — groups merge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, new_name]
              properties:
                name:
                  type: string
                new_name:
                  type: string
                  maxLength: 100
      responses:
        "200":
          description: OK (also when there is no such group here)
        "400":
          description: Empty or too long name

  /groups/delete:
    post:
      summary: Delete the account's group on this server; its circles stay on the street
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "200":
          description: OK (also when there is no such group here)

  /appearance:
    get:
      summary: Avatar shape shared by all of the person's devices (circle | square)
    put:
      summary: Set avatar shape (avatar_shape circle | square)

  /notify_prefs:
    get:
      summary: Account notification defaults
    put:
      summary: Set account notification defaults (mentions stay on)

  /circles/{circle_id}/notify_prefs:
    get:
      summary: Circle notification override
    put:
      summary: Set circle notification override (mentions stay on)

  /push/subscribe:
    post:
      summary: Register Web Push subscription
    delete:
      summary: Remove Web Push subscription

  /circles/{circle_id}/quota_requests:
    post:
      summary: Request circle quota expansion (owner)

  /pay/status:
    get:
      summary: Subscription gate and donate banner state
      responses:
        "200":
          description: required, expires_at, pending, banner, dismissed

  /pay/requests:
    post:
      summary: Submit subscription payment proof
      responses:
        "201":
          description: request id

  /pay/banner/dismiss:
    post:
      summary: Dismiss donate banner until admin releases a new one
      responses:
        "200":
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
