openapi: 3.1.0
info:
  title: Wynd participant API
  version: 0.14.2
  description: Participant routes (Bearer session). Admin routes are in a separate spec.

servers:
  - url: /api/v1

security:
  - bearerAuth: []

paths:
  /instance:
    get:
      summary: Public instance info
      security: []
      responses:
        "200":
          description: >-
            Instance name, version, registration mode, loopback, bootstrapped,
            code_delivery (`log` on loopback without SMTP, else `mail`), and
            source_url — the Corresponding Source address the client links to
            (AGPL 13).

  /probe:
    get:
      summary: Reverse-proxy diagnostics for admin browser checks
      security: []
      responses:
        "200":
          description: proto, peer_loopback, body_probe_bytes for PUT /probe/body, and instance — a per-process tag the admin check sends back to confirm the domain

  /probe/sse:
    get:
      summary: SSE buffering probe for admin browser checks
      security: []
      responses:
        "200":
          description: text/event-stream with one event

  /probe/stream:
    get:
      summary: Slow response stream probe for proxy read timeout checks
      security: []
      responses:
        "200":
          description: chunked octet stream (~2s)

  /probe/body:
    put:
      summary: Request body limit probe for admin browser checks
      security: []
      responses:
        "200":
          description: body accepted
        "413":
          description: body too large

  /sync:
    get:
      summary: Events after cursor in visible spans
      parameters:
        - name: cursor
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: SSE stream — hello frame with max_seq, then sync frames
          content:
            text/event-stream:
              schema:
                type: string
        "406":
          description: Accept without text/event-stream

  /circles:
    get:
      summary: Account circles with unread counts
      responses:
        "200":
          description: Circle list
    post:
      summary: Create circle
      responses:
        "201":
          description: Circle created

  /circles/{circle_id}/invites:
    get:
      summary: Live circle invites
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: invites[]
    post:
      summary: Create circle invite
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum: [single, multi]
                max_uses:
                  type: integer
                  minimum: 1
                  maximum: 1000
                ttl_sec:
                  type: integer
                  minimum: 1
                  maximum: 31536000
      responses:
        "201":
          description: Invite token
        "400":
          description: >-
            kind=multi is invalid when the circle allows only single invites;
            max_uses above 1000 or ttl_sec above 365 days are refused;
            unlimited_uses / no_expiry are admin-only and ignored here

  /circles/{circle_id}/invite-candidates:
    get:
      summary: People from inviter's other circles
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: groups[]

  /circles/{circle_id}/member-invites:
    post:
      summary: Personal invite for an existing account
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id]
              properties:
                account_id:
                  type: string
      responses:
        "201":
          description: invited

  /circles/{circle_id}/join-preview:
    get:
      summary: Join screen preview for pending personal invite
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: peek fields

  /circles/{circle_id}/join:
    post:
      summary: Complete pending circle join (name in circle)
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                body:
                  type: string
      responses:
        "200":
          description: OK

  /pending-circle-joins:
    get:
      summary: Circles awaiting join naming for session
      responses:
        "200":
          description: circle_ids[]

  /circles/{circle_id}/invites/{id}:
    delete:
      summary: Revoke circle invite
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK

  /circles/{circle_id}/leave:
    post:
      summary: Leave circle (retain_access keeps read until leave)
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK

  /circles/{circle_id}/read_cursor:
    put:
      summary: Advance read cursor for unread badge
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seq]
              properties:
                seq:
                  type: integer
      responses:
        "200":
          description: OK

  /circles/{circle_id}/feed:
    get:
      summary: Feed snapshot trimmed to visible spans
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Posts with media, comments, reactions

  /circles/{circle_id}/grid:
    get:
      summary: Photo grid snapshot
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Photo tiles

  /circles/{circle_id}/map:
    get:
      summary: Map pins snapshot
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Geotagged media

  /circles/{circle_id}/days:
    get:
      summary: Days with visible posts
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Day summaries

  /circles/{circle_id}/days/{date}:
    get:
      summary: Posts for one day by entry_date
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Day posts ordered by created_at

  /circles/{circle_id}/search/authors:
    get:
      summary: Distinct author names in circle search hits
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: has_photo
          in: query
          schema:
            type: string
            enum: ["1"]
        - name: has_location
          in: query
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Author names from FTS matches

  /circles/{circle_id}/search:
    get:
      summary: Full-text search in circle (with author)
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: has_photo
          in: query
          schema:
            type: string
            enum: ["1"]
        - name: has_location
          in: query
          schema:
            type: string
            enum: ["1"]
        - name: author
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Search hits

  /search:
    get:
      summary: Full-text search across all circles (no author)
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: has_photo
          in: query
          schema:
            type: string
            enum: ["1"]
        - name: has_location
          in: query
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Search hits

  /auth/register:
    post:
      summary: Register account (open mode)
      security: []
      responses:
        "202":
          description: Code sent

  /auth/code:
    post:
      summary: Request login code
      security: []
      responses:
        "202":
          description: Code sent

  /auth/verify:
    post:
      summary: Verify code and receive Bearer token
      security: []
      responses:
        "200":
          description: Session

  /auth/logout:
    post:
      summary: Revoke the current participant session
      responses:
        "200":
          description: OK

  /invites/{token}:
    get:
      summary: Public invite preview
      security: []
      responses:
        "200":
          description: Circle invite metadata, or server invite (server_name, host, inviter_name) without a circle
        "400":
          description: Invite revoked or already used up
        "410":
          description: Invite expired

  /invites/{token}/claim:
    post:
      summary: Take a circle invite with the current session
      responses:
        "200":
          description: Circle id and whether the account is already a member
        "400":
          description: Server invite, or invite invalid
        "403":
          description: Personal invite for another account

  /invites/{token}/join:
    post:
      summary: Complete deferred circle join after verify
      responses:
        "200":
          description: Joined

  /invites/{token}/accept:
    post:
      summary: Accept invite
      security: []
      responses:
        "202":
          description: Code sent

  /uploads:
    post:
      summary: Create blob upload session
      responses:
        "201":
          description: Upload session

  /uploads/{session_id}:
    head:
      summary: Upload resume status
    put:
      summary: Upload chunk

  /uploads/{session_id}/complete:
    post:
      summary: Complete upload

  /blobs/{blob_id}:
    get:
      summary: Download blob (attachment)

  /circles/{circle_id}/posts:
    post:
      summary: Create post
      parameters:
        - name: circle_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Post created

  /circles/{circle_id}/posts/{post_id}:
    patch:
      summary: Edit post
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                entry_date:
                  type: string
                cover_blob_id:
                  type: string
                media:
                  description: >-
                    Omitted — media untouched; present — replaces the whole set.
                    Together with cover_blob_id it is invalid: media carries the
                    cover itself.
                  type: array
                  items:
                    type: object
    delete:
      summary: Delete post branch

  /circles/{circle_id}/posts/{post_id}/comments:
    post:
      summary: Add comment

  /circles/{circle_id}/posts/{post_id}/comments/{comment_id}:
    patch:
      summary: Edit comment
    delete:
      summary: Delete comment

  /circles/{circle_id}/posts/{post_id}/reactions:
    put:
      summary: Set reaction
    delete:
      summary: Remove reaction

  /circles/{circle_id}/days/{date}/title:
    put:
      summary: Set day title
    delete:
      summary: Clear day title

  /circles/{circle_id}/days/{date}/cover:
    put:
      summary: Set day cover
    delete:
      summary: Clear day cover

  /circles/{circle_id}:
    get:
      summary: Circle detail with archive cycle banner
    patch:
      summary: Rename circle or change edit window (can_settings)
    delete:
      summary: Delete circle with name confirmation (owner)

  /circles/{circle_id}/members:
    get:
      summary: List circle members

  /circles/{circle_id}/members/{account_id}:
    put:
      summary: Set member can_settings (owner)

  /circles/{circle_id}/identity:
    get:
      summary: Identity name history in circle
    put:
      summary: Update identity name and/or avatar in circle

  /circles/{circle_id}/place:
    put:
      summary: Set own «share place from photos» default in circle (share_place)

  /circles/{circle_id}/transfer:
    post:
      summary: Transfer circle ownership (owner)

  /circles/{circle_id}/exclude:
    post:
      summary: Exclude member from circle (owner)

  /circles/{circle_id}/quota:
    get:
      summary: Used bytes, quota and media volume chart (owner)
      parameters:
        - name: cutoff_date
          in: query
          description: With it the answer also carries freed_at_cutoff_bytes.
          schema:
            type: string
            format: date

  /circles/{circle_id}/archive:
    post:
      summary: Start archive cycle (owner)

  /circles/{circle_id}/archive/cutoff:
    put:
      summary: Move cutoff before first download (owner)

  /circles/{circle_id}/archive/deadline:
    put:
      summary: Move archive deadline (owner)

  /circles/{circle_id}/archive/download:
    get:
      summary: Download personal archive ZIP
      parameters:
        - name: layout
          in: query
          schema:
            type: string
            enum: [feed, posts]

  /notify_prefs:
    get:
      summary: Account notification defaults
    put:
      summary: Set account notification defaults (mentions stay on)

  /circles/{circle_id}/notify_prefs:
    get:
      summary: Circle notification override
    put:
      summary: Set circle notification override (mentions stay on)

  /push/subscribe:
    post:
      summary: Register Web Push subscription
    delete:
      summary: Remove Web Push subscription

  /circles/{circle_id}/quota_requests:
    post:
      summary: Request circle quota expansion (owner)

  /pay/status:
    get:
      summary: Subscription gate and donate banner state
      responses:
        "200":
          description: required, expires_at, pending, banner, dismissed

  /pay/requests:
    post:
      summary: Submit subscription payment proof
      responses:
        "201":
          description: request id

  /pay/banner/dismiss:
    post:
      summary: Dismiss donate banner until admin releases a new one
      responses:
        "200":
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
